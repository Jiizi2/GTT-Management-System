services:
  web:
    build:
      context: .
      dockerfile: deploy/web/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${WEB_PORT:-8080}:80"

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    env_file:
      - ./apps/backend/.env
    environment:
      NODE_ENV: production
      PORT: 3001
      DATA_SOURCE: prisma
      AUTH_BOOTSTRAP_DEFAULT_USERS: "false"
      TRUST_PROXY: "true"
      INVOICE_DOCUMENT_ASSET_DIR: /run/secrets/invoice-document-assets
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gtt_ops}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3001"
    volumes:
      - ${INVOICE_DOCUMENT_ASSET_HOST_DIR:-./.private/invoice-document-assets}:/run/secrets/invoice-document-assets:ro

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-gtt_ops}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-gtt_ops}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - gtt_postgres_prod_data:/var/lib/postgresql/data
    # Keep PostgreSQL internal to the Compose network so it does not
    # compete with any other database service already bound on the VPS.
    expose:
      - "5432"

volumes:
  gtt_postgres_prod_data:
