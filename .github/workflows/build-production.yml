name: Build Production Artifact

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build_prod:
    name: Build Production-Ready Artifact
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify before packaging
        run: npm run verify

      - name: Package production artifact
        run: |
          mkdir -p release/apps/backend release/apps/frontend
          cp -r apps/backend/dist release/apps/backend/dist
          cp -r apps/backend/prisma release/apps/backend/prisma
          cp apps/backend/package.json release/apps/backend/package.json
          cp apps/backend/env.production.example release/apps/backend/env.production.example
          cp -r apps/frontend/dist release/apps/frontend/dist
          cp apps/frontend/package.json release/apps/frontend/package.json
          cp apps/frontend/env.production.example release/apps/frontend/env.production.example
          cp package.json package-lock.json release/
          tar -czf production-build-${GITHUB_SHA::7}.tar.gz -C release .
          sha256sum production-build-${GITHUB_SHA::7}.tar.gz > production-build-${GITHUB_SHA::7}.sha256

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-build-${{ github.sha }}
          path: |
            production-build-*.tar.gz
            production-build-*.sha256
          if-no-files-found: error
