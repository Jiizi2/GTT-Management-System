name: Build Development Artifact

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build_dev:
    name: Build Dev-Ready Artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate --workspace backend

      - name: Verify before packaging
        run: npm run verify

      - name: Package development artifact
        run: |
          mkdir -p release/apps/backend release/apps/frontend
          cp -r apps/backend/dist release/apps/backend/dist
          cp -r apps/backend/prisma release/apps/backend/prisma
          cp apps/backend/package.json release/apps/backend/package.json
          cp apps/backend/env.production.example release/apps/backend/env.production.example
          cp -r apps/frontend/dist release/apps/frontend/dist
          cp apps/frontend/package.json release/apps/frontend/package.json
          cp apps/frontend/env.production.example release/apps/frontend/env.production.example
          cp package.json package-lock.json release/
          tar -czf development-build-${GITHUB_SHA::7}.tar.gz -C release .

      - name: Upload development artifact
        uses: actions/upload-artifact@v4
        with:
          name: development-build-${{ github.sha }}
          path: development-build-*.tar.gz
          if-no-files-found: error
