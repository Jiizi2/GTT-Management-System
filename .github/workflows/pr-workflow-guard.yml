name: PR Workflow Guard

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches:
      - develop
      - master
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  enforce_pr_only:
    name: Enforce PR-only updates
    runs-on: ubuntu-latest
    steps:
      - name: Ensure commit comes from merged pull request
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace("refs/heads/", "");
            const protectedBranches = new Set(["develop", "master", "main"]);
            if (!protectedBranches.has(branch)) {
              core.info(`Branch ${branch} is outside guard scope.`);
              return;
            }

            const { owner, repo } = context.repo;
            const sha = context.sha;
            const { data: pullRequests } =
              await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner,
                repo,
                commit_sha: sha,
              });

            const mergedIntoTarget = pullRequests.filter(
              (pr) => Boolean(pr.merged_at) && pr.base?.ref === branch,
            );

            if (mergedIntoTarget.length === 0) {
              core.setFailed(
                `Direct push detected on ${branch} for ${sha}. ` +
                  `Use feature branch + pull request flow.`,
              );
              return;
            }

            core.info(
              `Commit ${sha} is linked to merged PR #${mergedIntoTarget[0].number} into ${branch}.`,
            );
